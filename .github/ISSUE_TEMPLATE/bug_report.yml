name: Bug report
description: Report a reproducible, non-security software or documentation issue.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include sensitive information or security exploit details. See SECURITY.md."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the software do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Error output, screenshots or a short explanation.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Input values, steps, OS and browser/Node version; use only synthetic or legally redistributable data.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Safety and evidence
      options:
        - label: I did not include credentials or private experimental data.
          required: true
