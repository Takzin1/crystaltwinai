name: Capture runtime demo GIF and promo MP4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked app dependencies
        run: npm ci
      - name: Install isolated browser capture tool
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build real app
        run: npm run build
      - name: Start localhost app
        run: |
          nohup npm run start -- --hostname 127.0.0.1 > /tmp/crystaltwin-runtime-demo.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
      - name: Capture genuine browser screenshots
        run: node scripts/capture-runtime-demo.mjs
      - name: Encode GIF and MP4 from captured app screens
        run: |
          cd artifacts/runtime-demo
          : > timeline.txt
          for i in 0 1 2 3 4 5; do
            printf "file 'shot-%02d.png'\nduration 2.5\n" "$i" >> timeline.txt
          done
          printf "file 'shot-05.png'\n" >> timeline.txt
          ffmpeg -hide_banner -y -loglevel error -f concat -safe 0 -i timeline.txt \
            -vf "fps=24,scale=1280:720:flags=lanczos,format=yuv420p" \
            -c:v libx264 -preset fast -crf 21 -movflags +faststart \
            crystaltwin-runtime-demo.mp4
          ffmpeg -hide_banner -y -loglevel error -i crystaltwin-runtime-demo.mp4 \
            -vf "fps=8,scale=960:540:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" \
            -loop 0 crystaltwin-runtime-demo.gif
      - uses: actions/upload-artifact@v4
        with:
          name: crystaltwin-real-runtime-demo
          path: artifacts/runtime-demo/
          retention-days: 7
          if-no-files-found: error
