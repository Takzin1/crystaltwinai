name: P0 CI

on:
  pull_request:
    branches:
      - main
      - hackathon/physical-ai
  push:
    branches:
      - "hackathon/**"
      - "chore/**"
      - "feat/**"

permissions:
  contents: read

jobs:
  node:
    name: Node quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  physics:
    name: Physics scaffold gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile physics scripts
        run: python -m compileall physics/scripts physics/tests

      - name: Unit tests
        run: python -m unittest discover -s physics/tests -p 'test_*.py'
