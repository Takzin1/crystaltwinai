name: Temporary lockfile remediation
on:
  push:
    branches: [feature/dataset-ingestion-audit-20261014]
permissions:
  contents: write
jobs:
  refresh-lock:
    if: "!contains(github.event.head_commit.message, 'chore(security): refresh lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve nonbreaking dependency security updates
        run: npm audit fix --package-lock-only --no-fund
      - name: Confirm package.json untouched and commit lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package.json; then
            echo "Refusing to auto-modify package.json"; exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes needed"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): refresh lockfile within declared semver"
          git push origin HEAD:feature/dataset-ingestion-audit-20261014
